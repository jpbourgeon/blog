name: Validate and prepare GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the selected main commit
        required: true
        type: string
      mode:
        description: Inspect the inventory, authorize the first site, publish articles or authorize permanent pages
        required: true
        type: choice
        default: inspect
        options: [inspect, bootstrap, publish, pages]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'github-pages' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build FR/EN
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:publication
      - run: npm run build

      - name: Verify the Pages output
        shell: bash
        run: |
          for prefix in build build/en; do
            for file in index.html about/index.html projects/index.html 404.html sitemap.xml; do
              if [[ ! -s "$prefix/$file" ]]; then
                echo "::error file=$prefix/$file::Missing or empty build output"
                exit 1
              fi
            done
          done
          grep -q '<html lang="fr"' build/index.html
          grep -q '<html lang="en"' build/en/index.html
          links=$(find build \( -type l -o -type f -links +1 \) -print -quit)
          test -z "$links"


  gate:
    name: Independent publication gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: read
    env:
      TARGET_COMMIT: ${{ inputs.commit }}
      PUBLICATION_MODE: ${{ inputs.mode }}
    outputs:
      artifact_name: ${{ steps.identity.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Validate the manual target
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != jpbourgeon/blog || "$GITHUB_REF" != refs/heads/main ||
                "$TARGET_COMMIT" != "$GITHUB_SHA" || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::Start a fresh dispatch on main and supply its exact commit SHA."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Establish the native Pages baseline
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/publication/pages.mts baseline "$PUBLICATION_MODE"

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:publication

      - name: Check the cumulative Git changes and editorial transitions
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: npm run publication -- plan "$PUBLICATION_MODE" "$GITHUB_SHA" "$BASELINE"

      - name: Build the exact bilingual site
        run: |
          export PUBLICATION_MANIFEST_DIR="$RUNNER_TEMP/publication-manifests"
          mkdir "$PUBLICATION_MANIFEST_DIR"
          npm run build

      - name: Verify the routes and package the checked bytes
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          npm run publication -- artifact "$PUBLICATION_MODE" "$GITHUB_SHA" "$BASELINE" build \
            "$RUNNER_TEMP/publication-manifests" "$RUNNER_TEMP/artifact.tar"

      - name: Bind the artifact to this commit and run
        if: inputs.mode != 'inspect'
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publication/pages.mts main
          echo "name=github-pages-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # This repository is public. Upload only after the checks on exposure.
      - name: Upload the gated Pages artifact
        if: inputs.mode != 'inspect'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.name }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'inspect'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/publication/pages.mts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify the immutable artifact and the selected main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.commit }}
          ARTIFACT_NAME: ${{ needs.gate.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.gate.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.gate.outputs.artifact_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/publication/pages.mts artifact

      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.gate.outputs.artifact_name }}
