name: Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full current SHA on main
        required: true
        type: string
      mode:
        description: Inspect without deploying, or publish after explicit approval
        required: true
        type: choice
        default: inspect
        options: [inspect, publish]

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'github-pages' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FR/EN site
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:publication
      - run: npm run build

  gate:
    name: Verify exact authorized site
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Validate manual target
        env:
          TARGET: ${{ inputs.commit }}
        run: |
          test "$GITHUB_REPOSITORY" = jpbourgeon/blog
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$TARGET"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:publication
      - name: Establish latest deployed baseline
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publication/baseline.mts
      - name: Check editorial transitions
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: npm run publication -- gate "$BASELINE"
      - run: npm run build
      - name: Upload verified site
        if: inputs.mode == 'publish'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy manually to GitHub Pages
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require selected main to remain current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ github.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$EXPECTED"
      - uses: actions/deploy-pages@v4
        id: deployment
